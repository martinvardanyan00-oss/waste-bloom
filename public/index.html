<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoWaste Armenia — Organic Management Platform</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container header-content">
      <div class="header-top">
        <h1 id="appTitle">🌱 EcoWaste Armenia</h1>
        <!-- Language Switcher Selector -->
        <div class="lang-switcher">
          <label for="langSelect" id="langLabel">🌐 Լեզու / Language:</label>
          <select id="langSelect">
            <option value="hy" selected>🇦🇲 Հայերեն</option>
            <option value="en">🇬🇧 English</option>
            <option value="ru">🇷🇺 Русский</option>
          </select>
        </div>
      </div>
      <p id="appSubtitle">Օրգանական թափոնների կառավարման և կոմպոստացման հարթակ</p>
    </div>
  </header>

  <main class="container">
    <!-- Stats Cards -->
    <section class="stats-grid">
      <div class="card">
        <h3 id="stat1Title">Հավաքված թափոն</h3>
        <p class="stat-num" id="totalWaste">0 kg</p>
      </div>
      <div class="card">
        <h3 id="stat2Title">Խնայված CO₂</h3>
        <p class="stat-num" id="co2Saved">0 kg</p>
      </div>
      <div class="card">
        <h3 id="stat3Title">Գործընկեր ռեստորաններ</h3>
        <p class="stat-num" id="activeRestaurants">0</p>
      </div>
    </section>

    <!-- Forms Section -->
    <section class="forms-grid">
      <!-- Restaurant Pickup Form -->
      <div class="card form-card">
        <h2 id="restFormTitle">🍽️ Ռեստորանների համար (Աղբի Հավաքագրում)</h2>
        <form id="pickupForm">
          <label id="restSelectLabel">Ընտրել Ռեստորանը</label>
          <select id="restSelect" required>
            <option value="" disabled selected>-- Ընտրեք ցանկից --</option>
            <!-- 10 partner restaurants populating dynamically -->
          </select>

          <label id="restLocLabel">Հասցե/Վայր</label>
          <input type="text" id="restLoc" placeholder="օր. Իսահակյան փ., Երևան" readonly required>
          
          <label id="restWeightLabel">Օրական Կանխատեսվող Աղբ (կգ)</label>
          <input type="number" id="restWeight" placeholder="35" required>
          
          <button type="submit" class="btn btn-primary" id="btnPickup">Գրանցել Հավաքագրման Պատվեր</button>
        </form>
      </div>

      <!-- Farmer Order Form -->
      <div class="card form-card">
        <h2 id="farmerFormTitle">🚜 Ֆերմերների համար (Կոմպոստի Պատվեր)</h2>
        <form id
